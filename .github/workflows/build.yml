name: Build

on:
  push:
    branches: [ main, lsposed-api-101-support ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Create debug keystore
        run: |
          mkdir -p Hook
          keytool -genkey -v -keystore Hook/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
      - name: Build with Gradle
        run: |
          ./gradlew :Hook:assembleDebug :Hook:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperoshape-debug
          path: Hook/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperoshape-release
          path: Hook/build/outputs/apk/release/*.apk
